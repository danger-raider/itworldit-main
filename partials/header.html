<!-- partials/header.html -->

<header id="siteHeader" class="site-header">
  <div class="site-header__inner">

    <!-- Brand -->
    <a href="/" data-page-path="/" class="site-header__brand" aria-label="It World IT homepage">
      <span class="site-header__logo">It World IT</span>
      <span class="site-header__tagline" data-i18n="brand_tagline">
        Turning complexity into simplicity
      </span>
    </a>

    <!-- Navigation -->
    <nav id="mainNav" class="site-header__nav" aria-label="Main navigation">
      <a href="/" data-page-path="/" class="site-header__nav-link" data-i18n="nav_home">Головна</a>
      <a href="/services.html" data-page-path="/services.html" class="site-header__nav-link" data-i18n="nav_services">Послуги</a>
     <!--  <a href="/blog.html" data-page-path="/blog.html" class="site-header__nav-link" data-i18n="nav_blog">Блог</a>-->
      <a href="/about.html" data-page-path="/about.html" class="site-header__nav-link" data-i18n="nav_about">Про нас</a>
      <a href="/contact.html" data-page-path="/contact.html" class="site-header__nav-link" data-i18n="nav_contact">Контакти</a>
    </nav>

    <!-- Controls -->
    <div class="site-header__controls">

      <!-- Language dropdown -->
      <div class="site-dropdown" data-dropdown>
        <button
          id="langDropdownButton"
          type="button"
          class="site-dropdown__button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-label="Choose language"
        >
          <span id="langCurrent" class="site-dropdown__current">UA</span>
          <span class="site-dropdown__chevron" aria-hidden="true">▾</span>
        </button>

        <div
          class="site-dropdown__menu"
          role="listbox"
          aria-labelledby="langDropdownButton"
        >
          <button
            type="button"
            class="site-dropdown__option"
            role="option"
            data-lang-value="ua"
          >
            <span class="site-dropdown__option-main">UA</span>
            <span class="site-dropdown__option-sub">Українська</span>
          </button>

          <button
            type="button"
            class="site-dropdown__option"
            role="option"
            data-lang-value="en"
          >
            <span class="site-dropdown__option-main">EN</span>
            <span class="site-dropdown__option-sub">English</span>
          </button>
        </div>
      </div>

      <!-- Theme switcher -->
      <button
        id="themeToggle"
        type="button"
        class="site-header__button"
        aria-label="Toggle theme"
      >
        <span id="themeIcon" class="site-header__icon" aria-hidden="true">🌙</span>
        <span id="themeLabel" class="site-header__button-label">Dark</span>
      </button>



      <!-- Mobile menu button -->
      <button
        id="menuToggle"
        type="button"
        class="site-header__menu-button"
        aria-label="Open menu"
        aria-controls="mainNav"
        aria-expanded="false"
      >
        <span id="menuIcon" aria-hidden="true">☰</span>
      </button>

    </div>

  </div>
</header>
